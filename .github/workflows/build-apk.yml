name: Build EMAN BAZAR APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract EMAN BAZAR project
        run: |
          mkdir project
          unzip -q eman_bazar_v0.7_full_project.zip -d project

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android build
        working-directory: project
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties
          sed -i 's/id "com.android.application" version "8.6.1"/id "com.android.application" version "9.1.1"/' android/settings.gradle
          cat > android/build.gradle <<'EOF'
          allprojects {
              repositories {
                  google()
                  mavenCentral()
                  maven { url "https://storage.googleapis.com/download.flutter.io" }
              }
          }
          EOF
          cd android
          gradle wrapper --gradle-version 9.3.1
          cd ..

      - name: Get packages
        working-directory: project
        run: flutter pub get

      - name: Build APK
        working-directory: project
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: eman-bazar-apk
          path: project/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
