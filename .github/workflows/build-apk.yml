name: Build EMAN BAZAR APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract EMAN BAZAR project
        run: |
          mkdir project
          unzip -q eman_bazar_v0.7_full_project.zip -d project

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fix Android Gradle Plugin
        working-directory: project
        run: |
          sed -i 's/com.android.application" version "8.6.1"/com.android.application" version "8.11.1"/' android/settings.gradle

      - name: Prepare Gradle 8.13
        working-directory: project
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties
          curl -fsSL -o /tmp/gradle-8.13-bin.zip https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q /tmp/gradle-8.13-bin.zip -d /tmp
          /tmp/gradle-8.13/bin/gradle wrapper --gradle-version 8.13

      - name: Get packages
        working-directory: project
        run: flutter pub get

      - name: Build APK
        working-directory: project
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: eman-bazar-apk
          path: project/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error