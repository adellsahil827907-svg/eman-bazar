
name: Build EMAN BAZAR APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract EMAN BAZAR project
        run: |
          mkdir -p project
          unzip -q eman_bazar_v0.7_full_project.zip -d project

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fix Android Gradle versions
        working-directory: project
        run: |
          sed -i 's/com.android.application" version "8.6.1"/com.android.application" version "8.11.1"/' android/settings.gradle
          sed -i 's#^distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.13-bin.zip#' android/gradle/wrapper/gradle-wrapper.properties
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: Get packages
        working-directory: project
        run: flutter pub get

      - name: Build APK
        working-directory: project
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: eman-bazar-apk
          path: project/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
